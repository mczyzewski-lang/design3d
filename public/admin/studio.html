<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/konfigurator/brand/design3d-mark.svg" />
  <title>design3d schody · analityka</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .chart { width: 100%; height: 190px; display: block; }
    .chart .bar-p { fill: var(--accent); }
    .chart .bar-c { fill: var(--ok); }
    .chart .line-v { fill: none; stroke: var(--warn); stroke-width: 2; }
    .chart .axis { stroke: var(--border); }
    .chart text { fill: var(--muted); font-size: 10px; }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .breakdown { display: flex; flex-direction: column; gap: 7px; }
    .breakdown .b-row { display: grid; grid-template-columns: minmax(120px, 1.3fr) 2fr 44px; gap: 10px; align-items: center; font-size: 13px; }
    .breakdown .b-bar { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--border); }
    .breakdown .b-bar span { display: block; height: 100%; background: var(--accent); }
    .three { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .funnel { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
    .funnel .f-step { flex: 1; min-width: 140px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .funnel .f-step b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
    .funnel .f-arrow { display: grid; place-items: center; color: var(--muted); }
    td .matches { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><img src="/konfigurator/brand/design3d-mark.svg" alt="design3d" width="34" height="34" style="border-radius:9px;display:block" /><div><strong>design3d.pl</strong><small>Panel administracyjny</small></div></div>
      <nav>
        <div class="nav-section">design3d schody</div>
        <a href="studio.html" class="active">Analityka konfiguratora</a>
        <div class="nav-section">Lead Discovery</div>
        <a href="index.html#/dashboard">Pulpit</a>
        <a href="index.html#/projects">Projekty wyszukiwania</a>
        <a href="index.html#/companies">Firmy</a>
      </nav>
      <div class="sidebar-foot"><a href="/" target="_blank" rel="noopener">Strona główna ↗</a><a href="/konfigurator/" target="_blank" rel="noopener">Konfigurator ↗</a></div>
    </aside>
    <main>
      <header class="topbar">
        <h1>design3d schody — analityka</h1>
        <div class="topbar-right">
          <label class="scope">Okres:
            <select id="days"><option value="7">7 dni</option><option value="30" selected>30 dni</option><option value="90">90 dni</option><option value="365">12 miesięcy</option></select>
          </label>
          <button class="btn" id="refresh" type="button">Odśwież</button>
        </div>
      </header>
      <section id="view" class="view"><div class="empty">Wczytywanie…</div></section>
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="studio.js" type="module"></script>
</body>
</html>
